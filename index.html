<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>CrediLoan v2.0</title>

<link rel="stylesheet"
href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<!-- PIN LOCK -->

<div id="pinScreen">

<div class="pinBox">

<h2>🔒 CrediLoan</h2>

<p>Enter PIN</p>

<input
type="password"
id="pinInput"
maxlength="4"
placeholder="1234">

<button onclick="checkPin()">
    Unlock
</button>

</div>

</div>

<header>

<h1>💰 CrediLoan</h1>

<p>Credit & Loan Manager</p>

<button
id="darkBtn"
onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

<button onclick="login()">Google Login</button>

<button onclick="logout()">Logout</button>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565C0">

</header>

<div class="container">

<!-- DASHBOARD -->

<div class="card dashboard">

<div class="box">

<h3 id="totalReceive">
Rs.0
</h3>

<p>Receivable</p>

</div>

<div class="box">

<h3 id="totalPay">
Rs.0
</h3>

<p>Payable</p>

</div>

<div class="box">

<h3 id="balance">
Rs.0
</h3>

<p>Net Balance</p>

</div>

</div>

<!-- REPORT -->

<div class="card">

<h2>Reports</h2>

<div class="dashboard">

<div class="box">

<h3 id="todayReport">
Rs.0
</h3>

<p>Today</p>

</div>

<div class="box">

<h3 id="weekReport">
Rs.0
</h3>

<p>This Week</p>

</div>

<div class="box">

<h3 id="monthReport">
Rs.0
</h3>

<p>This Month</p>

</div>

</div>

</div>

<!-- FORM -->

<div class="card">

<h2>New Transaction</h2>

<input
type="text"
id="name"
placeholder="Name">

<input
type="number"
id="amount"
placeholder="Total Amount">

<input
type="number"
id="paidAmount"
placeholder="Paid Amount">

<select id="type">

<option>
Receive
</option>

<option>
Pay
</option>

</select>

<input
type="date"
id="dueDate">

<select id="status">

<option>
Pending
</option>

<option>
Completed
</option>

</select>

<textarea
id="note"
placeholder="Note"></textarea>

<button onclick="saveNewTransaction()">

Save Transaction

</button>

</div>

<!-- SEARCH -->

<div class="card">

<input
id="search"
placeholder="Search Name"
onkeyup="searchData()">

</div>

<!-- HISTORY -->

<div class="card" id="history"></div>

</div>

<!-- BACKUP -->

<div class="card">

<button
onclick="backupData()">

Export Backup

</button>

<button
onclick="downloadPDF()">
  

Download PDF

</button>

<button onclick="changePin()">
    Change PIN
</button>

<br><br>

<input
type="file"
onchange="restoreData(event)">

</div>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="firestore.js"></script>
<script type="module" src="script.js"></script>

</body>

</html>
